# =====================================================================
# Global Hero Registration Authority Management System (GHRMS)
# Production Nginx Reverse Proxy & Hardened Web Server Configuration
# =====================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Client body and file upload limits (matches 10MB document/avatar limit)
    client_max_body_size 12M;
    client_body_buffer_size 128k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Upstream GHRMS application server
    upstream ghrms_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost _;

        root /var/www/html;
        index index.html;

        # -----------------------------------------------------------------
        # Security Headers
        # -----------------------------------------------------------------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

        # -----------------------------------------------------------------
        # Strict Security Perimeter: Deny sensitive internal files
        # -----------------------------------------------------------------
        # Hidden dotfiles (.git, .env, etc.)
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
            return 403;
        }

        # Internal directories & documentation
        location ~* ^/(backend|tests|scratch|docs|unused)/ {
            deny all;
            return 403;
        }

        # Configuration, container, and deployment files
        location ~* /(Dockerfile|docker-compose\.ya?ml|nginx\.conf|check_system\.php|share\.(sh|bat|ps1)|start\.(bat|ps1)|deploy\.sh|php\.ini|\.env|\.git) {
            deny all;
            return 403;
        }

        # -----------------------------------------------------------------
        # Static Asset Serving & Caching
        # -----------------------------------------------------------------
        location ~* \.(css|js|jpg|jpeg|png|gif|svg|webp|ico|woff2?|ttf|eot)$ {
            root /var/www/html/public;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # Biometric uploads
        location /uploads/ {
            root /var/www/html/public;
            expires 7d;
            add_header Cache-Control "public, no-transform";
            try_files $uri =404;
        }

        # -----------------------------------------------------------------
        # Dynamic Application Gateway (PHP Proxy / Front Controller)
        # -----------------------------------------------------------------
        location / {
            proxy_pass http://ghrms_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
        }
    }
}
